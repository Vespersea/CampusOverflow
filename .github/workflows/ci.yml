# CampusOverflow 持续集成流水线（仓库根目录版）
# 说明：GitHub 只会执行仓库根目录 .github/workflows/ 下的工作流，
#      工程实体在 campus-overflow-student/，因此统一用 working-directory 切换。
name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'wiki/**'
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: campus-overflow-student

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      - name: 单元测试
        run: mvn -B -f backend/pom.xml test

      - name: 架构约束检查（ArchUnit FF-1~FF-6）
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false

      - name: 集成测试（Testcontainers）
        # 依赖 Docker/Testcontainers，环境不具备时不让整条流水线变红；正式门禁另议
        continue-on-error: true
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: campus-overflow-student/**/target/*-reports/*.xml
          if-no-files-found: ignore

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: campus-overflow-student/frontend/package-lock.json
      - name: 安装依赖
        working-directory: campus-overflow-student/frontend
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        working-directory: campus-overflow-student/frontend
        run: npm run typecheck
      - name: 构建
        working-directory: campus-overflow-student/frontend
        run: npm run build
      - name: Lint
        working-directory: campus-overflow-student/frontend
        run: npm run lint

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v5
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .

  deploy:
    name: 部署到测试服务器（配置 DEPLOY_HOST 后生效）
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    steps:
      - uses: actions/checkout@v5
      - name: 登录镜像仓库
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
      - name: 推送镜像
        run: |
          docker build -f deploy/backend.Dockerfile -t "${{ vars.REGISTRY }}/campus-overflow-backend:${{ github.sha }}" .
          docker build -f deploy/frontend.Dockerfile -t "${{ vars.REGISTRY }}/campus-overflow-web:${{ github.sha }}" .
          docker push "${{ vars.REGISTRY }}/campus-overflow-backend:${{ github.sha }}"
          docker push "${{ vars.REGISTRY }}/campus-overflow-web:${{ github.sha }}"
      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/campus-overflow && docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
      - name: Smoke Test（健康检查）
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ vars.DEPLOY_HOST }}/actuator/health" | grep -q '"UP"'; then
              echo "SMOKE TEST PASSED"; exit 0
            fi
            sleep 5
          done
          echo "SMOKE TEST FAILED"; exit 1
