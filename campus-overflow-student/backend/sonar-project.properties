# SonarQube 项目配置（Lab 7 质量门禁）
# 分析命令：mvn sonar:sonar -Dsonar.host.url=<你的SonarQube地址> -Dsonar.token=<token>
sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.projectVersion=0.1.0

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.java.binaries=**/target/classes
sonar.java.libraries=**/target/**/*.jar

# 测试报告：Surefire XML 与 JaCoCo XML（mvn verify 时生成）
sonar.junit.reportPaths=**/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# 排除第三方与生成代码
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**
