# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（领域层 + 应用层，毫秒级，无外部依赖）
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6）
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest -DfailIfNoTests=false

      # 阶段 4：领域层覆盖率门禁（低于阈值直接失败）
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis）
      - name: 集成测试
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .

  deploy:
    name: 部署到测试服务器（配置 DEPLOY_HOST 后生效）
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    steps:
      - uses: actions/checkout@v4
      - name: 登录镜像仓库
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
      - name: 推送镜像
        run: |
          docker build -f deploy/backend.Dockerfile -t "${{ vars.REGISTRY }}/campus-overflow-backend:${{ github.sha }}" .
          docker build -f deploy/frontend.Dockerfile -t "${{ vars.REGISTRY }}/campus-overflow-web:${{ github.sha }}" .
          docker push "${{ vars.REGISTRY }}/campus-overflow-backend:${{ github.sha }}"
          docker push "${{ vars.REGISTRY }}/campus-overflow-web:${{ github.sha }}"
      - name: SSH 部署（docker compose pull && up -d）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY,IMAGE_TAG,DB_PASSWORD,CO_FIELD_KEY
          script: |
            export REGISTRY=${{ vars.REGISTRY }} IMAGE_TAG=${{ github.sha }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }} CO_FIELD_KEY=${{ secrets.CO_FIELD_KEY }}
            cd /opt/campus-overflow && docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
      - name: Smoke Test（健康检查）
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ vars.DEPLOY_HOST }}/actuator/health" | grep -q '"UP"'; then
              echo "SMOKE TEST PASSED"; exit 0
            fi
            sleep 5
          done
          echo "SMOKE TEST FAILED"; exit 1
